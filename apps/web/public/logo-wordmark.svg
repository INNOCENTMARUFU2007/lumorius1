<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" fill="none" role="img" aria-label="Lumorius">
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050C1A"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="gH" x1="10" y1="10" x2="70" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="textH" x1="100" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <!-- Icon background -->
  <rect x="0" y="0" width="80" height="80" rx="14" fill="url(#bgH)"/>

  <!-- Cardinal rays -->
  <polygon points="40,5 42,33 38,33" fill="url(#gH)" fill-opacity="0.9"/>
  <polygon points="40,75 42,47 38,47" fill="url(#gH)" fill-opacity="0.9"/>
  <polygon points="75,40 47,42 47,38" fill="url(#gH)" fill-opacity="0.9"/>
  <polygon points="5,40 33,42 33,38" fill="url(#gH)" fill-opacity="0.9"/>
  <!-- Diagonal rays -->
  <polygon points="65.6,14.4 43.5,36 41,33.5" fill="url(#gH)" fill-opacity="0.45"/>
  <polygon points="65.6,65.6 41,47 43.5,44.5" fill="url(#gH)" fill-opacity="0.45"/>
  <polygon points="14.4,65.6 39,44.5 41.5,47" fill="url(#gH)" fill-opacity="0.45"/>
  <polygon points="14.4,14.4 41.5,33.5 39,36" fill="url(#gH)" fill-opacity="0.45"/>
  <!-- Outer ring -->
  <circle cx="40" cy="40" r="24" stroke="url(#gH)" stroke-width="1" stroke-opacity="0.3" fill="none"/>
  <!-- Central diamond -->
  <polygon points="40,27 50,40 40,53 30,40" fill="url(#gH)" fill-opacity="0.12" stroke="url(#gH)" stroke-width="1.5"/>
  <polygon points="40,31 46,40 40,49 34,40" fill="url(#gH)"/>
  <circle cx="40" cy="40" r="2.5" fill="#FEF3C7"/>

  <!-- Wordmark -->
  <text x="100" y="51"
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
    font-size="36" font-weight="700" letter-spacing="-0.5"
    fill="url(#textH)">Lumorius</text>

  <!-- Tagline -->
  <text x="101" y="68"
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif"
    font-size="10" font-weight="400" letter-spacing="3.5"
    fill="#64748B">ENTERPRISE AI PLATFORM</text>
</svg>
