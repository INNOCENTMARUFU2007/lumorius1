version: '3.9'

# ============================================================
# Lumorius AI — Full Stack Docker Compose
# INMARTECH PVT LTD
# ============================================================
# Usage:
#   cp .env.example .env && nano .env
#   docker compose up -d
#   docker compose logs -f api
# ============================================================

services:
  # ── PostgreSQL 15 ─────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: lumorius_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-lumorius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumorius_dev_pwd}
      POSTGRES_DB:       ${POSTGRES_DB:-lumorius_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumorius}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumorius

  # ── Redis 7 ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lumorius_redis
    restart: unless-stopped
    command: >
      redis-server
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumorius

  # ── OpenSearch (vector + full-text search) ─────────────────
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: lumorius_opensearch
    restart: unless-stopped
    environment:
      discovery.type:          single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-Admin@123456}
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lumorius

  # ── Lumorius API (NestJS) ───────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: lumorius_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumorius}:${POSTGRES_PASSWORD:-lumorius_dev_pwd}@postgres:5432/${POSTGRES_DB:-lumorius_db}
      REDIS_URL:    redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:    { condition: service_healthy }
      redis:       { condition: service_healthy }
      opensearch:  { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lumorius
    volumes:
      - api_uploads:/app/uploads

  # ── Lumorius Web (Next.js) ──────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost}/api
    container_name: lumorius_web
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost}/api
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api: { condition: service_healthy }
    networks:
      - lumorius

  # ── Nginx Reverse Proxy ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: lumorius_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - api
      - web
    networks:
      - lumorius

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  api_uploads:
  nginx_certs:

networks:
  lumorius:
    driver: bridge
