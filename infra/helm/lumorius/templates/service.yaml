apiVersion: v1
kind: Service
metadata:
  name: {{ include "lumorius.fullname" . }}-api
  labels: {{- include "lumorius.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.api.type }}
  ports:
    - port: {{ .Values.service.api.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "lumorius.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lumorius.fullname" . }}-web
  labels: {{- include "lumorius.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.web.type }}
  ports:
    - port: {{ .Values.service.web.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector: {{- include "lumorius.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
