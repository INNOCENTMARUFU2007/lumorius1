apiVersion: v1
kind: ConfigMap
metadata:
  name: lumorius-config
  namespace: lumorius
data:
  NODE_ENV:                production
  PORT:                    "3001"
  LOG_LEVEL:               info
  JWT_EXPIRES_IN:          15m
  JWT_REFRESH_EXPIRES_IN:  7d
  DATABASE_POOL_MIN:       "2"
  DATABASE_POOL_MAX:       "20"
  MAX_FAILED_LOGIN_ATTEMPTS: "5"
  ACCOUNT_LOCKOUT_MINUTES: "30"
  EMAIL_VERIFY_TTL_HOURS:  "24"
  PASSWORD_RESET_TTL_MINUTES: "60"
  OPENSEARCH_URL:          http://lumorius-opensearch:9200
  REDIS_URL:               redis://lumorius-redis:6379
