---
# Horizontal Pod Autoscaler — API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lumorius-api-hpa
  namespace: lumorius
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lumorius-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type:          Pods
          value:         3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type:          Pods
          value:         1
          periodSeconds: 120

---
# Horizontal Pod Autoscaler — Web
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lumorius-web-hpa
  namespace: lumorius
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lumorius-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
