# IMPORTANT: Do NOT commit real secrets to version control.
# This file is a TEMPLATE. Populate using:
#   kubectl create secret generic lumorius-secrets \
#     --from-env-file=.env.production \
#     --dry-run=client -o yaml | kubectl apply -f -
# Or use sealed-secrets / external-secrets-operator for GitOps.
apiVersion: v1
kind: Secret
metadata:
  name: lumorius-secrets
  namespace: lumorius
type: Opaque
stringData:
  DATABASE_URL:           "${DATABASE_URL}"
  REDIS_URL:              "${REDIS_URL}"
  JWT_SECRET:             "${JWT_SECRET}"
  JWT_REFRESH_SECRET:     "${JWT_REFRESH_SECRET}"
  SESSION_SECRET:         "${SESSION_SECRET}"
  STRIPE_SECRET_KEY:      "${STRIPE_SECRET_KEY}"
  STRIPE_WEBHOOK_SECRET:  "${STRIPE_WEBHOOK_SECRET}"
  OPENAI_API_KEY:         "${OPENAI_API_KEY}"
  ANTHROPIC_API_KEY:      "${ANTHROPIC_API_KEY}"
  SMTP_HOST:              "${SMTP_HOST}"
  SMTP_PORT:              "${SMTP_PORT}"
  SMTP_USER:              "${SMTP_USER}"
  SMTP_PASS:              "${SMTP_PASS}"
  VAULT_ADDR:             "${VAULT_ADDR}"
  VAULT_TOKEN:            "${VAULT_TOKEN}"
