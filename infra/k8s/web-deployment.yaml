apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumorius-web
  namespace: lumorius
  labels:
    app: lumorius-web
    app.kubernetes.io/part-of: lumorius
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lumorius-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: lumorius-web
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser:    1001

      containers:
        - name: web
          image: ${ECR_WEB_IMAGE}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_API_URL
              value: "https://lumorius.com/api/v1"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"

          resources:
            requests:
              cpu:    200m
              memory: 256Mi
            limits:
              cpu:    500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds:       20
            timeoutSeconds:      5
            failureThreshold:    3

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds:       10
            timeoutSeconds:      3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

      imagePullSecrets:
        - name: ghcr-pull-secret

---
apiVersion: v1
kind: Service
metadata:
  name: lumorius-web
  namespace: lumorius
  labels:
    app: lumorius-web
spec:
  selector:
    app: lumorius-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
