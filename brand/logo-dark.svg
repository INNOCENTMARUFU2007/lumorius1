<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" role="img" aria-label="Lumorius">
  <!-- Light-mode version: white/cream background -->
  <defs>
    <linearGradient id="goldDark" x1="60" y1="60" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="goldFadeD" x1="120" y1="40" x2="120" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background: white -->
  <rect width="240" height="240" rx="40" fill="#FFFFFF"/>

  <!-- Subtle warm glow -->
  <circle cx="120" cy="120" r="72" fill="url(#goldFadeD)"/>

  <!-- Outer ring -->
  <circle cx="120" cy="120" r="74" stroke="url(#goldDark)" stroke-width="1.5" stroke-opacity="0.25" fill="none"/>

  <!-- Ray: North -->
  <polygon points="120,46 124,104 116,104" fill="url(#goldDark)" fill-opacity="0.85"/>
  <!-- Ray: South -->
  <polygon points="120,194 124,136 116,136" fill="url(#goldDark)" fill-opacity="0.85"/>
  <!-- Ray: East -->
  <polygon points="194,120 136,124 136,116" fill="url(#goldDark)" fill-opacity="0.85"/>
  <!-- Ray: West -->
  <polygon points="46,120 104,124 104,116" fill="url(#goldDark)" fill-opacity="0.85"/>

  <!-- Ray: NE -->
  <polygon points="172.3,67.7 126,112 119,105" fill="url(#goldDark)" fill-opacity="0.35"/>
  <!-- Ray: SE -->
  <polygon points="172.3,172.3 119,135 126,128" fill="url(#goldDark)" fill-opacity="0.35"/>
  <!-- Ray: SW -->
  <polygon points="67.7,172.3 121,128 114,135" fill="url(#goldDark)" fill-opacity="0.35"/>
  <!-- Ray: NW -->
  <polygon points="67.7,67.7 121,105 114,112" fill="url(#goldDark)" fill-opacity="0.35"/>

  <!-- Central diamond (rhombus) -->
  <polygon points="120,100 136,120 120,140 104,120" fill="url(#goldDark)" fill-opacity="0.08" stroke="url(#goldDark)" stroke-width="2"/>

  <!-- Inner diamond core -->
  <polygon points="120,108 128,120 120,132 112,120" fill="url(#goldDark)"/>

  <!-- Center point -->
  <circle cx="120" cy="120" r="3.5" fill="#92400E"/>
</svg>
