version: '3.8'

# Optional: Add this to your production stack for full observability
# docker compose -f infra/docker/docker-compose.yml -f observability/docker-compose.monitoring.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: lumorius-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - lumorius-network

  grafana:
    image: grafana/grafana:10.3.1
    container_name: lumorius-grafana
    ports:
      - '3003:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-lumorius_grafana}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - lumorius-network

  loki:
    image: grafana/loki:2.9.4
    container_name: lumorius-loki
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - lumorius-network

  promtail:
    image: grafana/promtail:2.9.4
    container_name: lumorius-promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - lumorius-network

volumes:
  prometheus_data:
  grafana_data:

networks:
  lumorius-network:
    external: true
    name: lumorius_default
