# Loki Configuration — Lumorius AI Log Aggregation
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/loki
  storage:
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory:  /var/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://alertmanager:9093

limits_config:
  retention_period:    720h   # 30 days
  max_query_series:    50000
  max_entries_limit_per_query: 50000
  ingestion_rate_mb:   16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit:       3MB
  per_stream_rate_limit_burst: 15MB

# ── Lumorius pipeline stages (structured logging) ──────────────
# Applied automatically when Promtail ships logs with these labels
# Label: app=lumorius-api → apply JSON pipeline

pipeline_stages_examples:
  # NestJS JSON log format from Pino
  lumorius_api: |
    - json:
        expressions:
          level:     level
          timestamp: time
          context:   context
          message:   msg
          requestId: reqId
          userId:    userId
          orgId:     orgId
          method:    method
          url:       url
          statusCode: statusCode
          duration:  responseTime
    - labels:
        level:
        context:
    - timestamp:
        source: timestamp
        format: RFC3339Nano
    - output:
        source: message
